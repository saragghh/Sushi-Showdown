<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sushi Showdown</title>
  <style>
    :root {
      --pink:#f2a8bd; --blush:#e7b5ca; --lavender:#b9a0d3;
      --silver:#d8d3df; --plum:#382536; --midnight:#211821;
    }
    * { box-sizing:border-box; }
    html, body {
      width:100%; height:100%; margin:0; overflow:hidden;
      background:#130d16; color:white;
      font-family:"Trebuchet MS","Segoe UI",sans-serif;
    }
    body {
      display:grid; place-items:center;
      background:
        radial-gradient(circle at 50% 20%, rgba(242,168,189,.10), transparent 38%),
        #130d16;
    }
    #wrap {
      width:min(100vw, calc(100vh * 16 / 9));
      height:min(100vh, calc(100vw * 9 / 16));
      position:relative;
      box-shadow:0 0 60px rgba(242,168,189,.12);
    }
    canvas {
      display:block; width:100%; height:100%;
      cursor:default;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
  <script>
  "use strict";

  // ==================== CONFIGURATION ====================
  const CONFIG = {
    requiredIngredients: 6,
    wrongItemPenalty: 2,
    aiShopDuration: 32,
    aiAssemblyDuration: 38,
    aiCutDuration: 42,
    aiServeDuration: 34,
    requiredRolls: 3,
    ingredientsPerRoll: 4,
    cuttingTolerance: 58,
    conveyorSpeed: 115,
    playerSpeed: 210,
    requiredCustomers: 3
  };

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = 1280, H = 720;
  let gameState = "menu";
  let paused = false;
  let pausedAt = 0;
  let lastTime = performance.now();
  let sessionStart = 0;
  let stageStart = 0;
  let transitionUntil = 0;
  let stageCompleteMessage = "";
  let mouse = { x:0, y:0, down:false };
  let keys = {};
  let enterPressed = false;

  const stats = {
    shopTime: null,
    assemblyAccuracy: null,
    cuttingAccuracy: null,
    servingTime: null,
    assemblyCorrect: 0,
    assemblyAttempts: 0,
    cuttingCorrect: 0,
    cuttingAttempts: 0,
    cuttingResolved: 0
  };

  const requiredNames = ["Sushi rice","Nori","Salmon","Cucumber","Egg","Avocado"];
  const shelfColors = ["#f3d28a","#386b55","#ef6f91","#98c96d","#ffd98a","#7bbd78","#ef8c72","#d8d3df","#f49aaf","#d0a8d8"];

  let shop = {};
  let assembly = {};
  let cutting = {};
  let serving = {};

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a,b,t) { return a + (b-a)*t; }
  function smooth(v) { return clamp(v,0,100); }
  function elapsedSince(t) { return ((paused ? pausedAt : performance.now())-t)/1000; }

  function togglePause() {
    if (!paused) {
      paused = true;
      pausedAt = performance.now();
      return;
    }

    const pauseDuration = performance.now() - pausedAt;
    if (sessionStart) sessionStart += pauseDuration;
    if (stageStart) stageStart += pauseDuration;
    if (transitionUntil) transitionUntil += pauseDuration;
    if (assembly.feedbackUntil) assembly.feedbackUntil += pauseDuration;
    if (cutting.feedbackUntil) cutting.feedbackUntil += pauseDuration;
    if (serving.feedbackUntil) serving.feedbackUntil += pauseDuration;
    paused = false;
    pausedAt = 0;
    lastTime = performance.now();
  }

  function resetGame() {
    gameState = "menu";
    paused = false;
    pausedAt = 0;
    sessionStart = 0;
    stageStart = 0;
    transitionUntil = 0;
    stageCompleteMessage = "";
    keys = {};
    enterPressed = false;
    Object.assign(stats,{
      shopTime:null, assemblyAccuracy:null, cuttingAccuracy:null, servingTime:null,
      assemblyCorrect:0, assemblyAttempts:0, cuttingCorrect:0, cuttingAttempts:0,
      cuttingResolved:0
    });
  }

  // ==================== DRAWING HELPERS ====================
  function roundedRect(x,y,w,h,r,fill,stroke,linewidth=2) {
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
    if (fill) { ctx.fillStyle=fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=linewidth; ctx.stroke(); }
  }

  function text(str,x,y,size=24,align="left",baseline="alphabetic",color="#fff",font="Trebuchet MS") {
    ctx.save();
    ctx.fillStyle=color; ctx.font=`${size}px ${font}`; ctx.textAlign=align; ctx.textBaseline=baseline;
    ctx.fillText(str,x,y);
    ctx.restore();
  }

  function star(x,y,r,color="#fff") {
    ctx.save(); ctx.translate(x,y); ctx.fillStyle=color;
    ctx.beginPath();
    for (let i=0;i<8;i++) {
      const a=i*Math.PI/4, rr=i%2?r*.25:r;
      ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function progressBar(x,y,w,label,value,color,icon) {
    roundedRect(x,y,w,28,14,"rgba(33,24,33,.72)","rgba(216,211,223,.55)");
    const pw=(w-8)*smooth(value)/100;
    roundedRect(x+4,y+4,Math.max(0,pw),20,10,color,null);
    ctx.save(); ctx.globalAlpha=.65; ctx.fillStyle="#fff";
    ctx.fillRect(x+8,y+9,Math.max(0,pw*.62),2); ctx.restore();
    text(icon||"",x-30,y+20,20,"center","middle","#e7b5ca");
    text(label,x,y-8,17,"left","alphabetic","#fff");
  }

  function drawSushiRoll(cx,cy,scale=1,ingredientCount=4,vertical=false) {
    ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale);
    if (vertical) {
      ctx.rotate(-.05);
      roundedRect(-58,-42,116,84,18,"#24151f","#e7b5ca",3);
      ctx.beginPath(); ctx.arc(0,0,36,0,Math.PI*2); ctx.fillStyle="#f5ede2"; ctx.fill();
      ctx.strokeStyle="#2d1c28"; ctx.lineWidth=12; ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fillStyle="#f2a8bd"; ctx.fill();
      ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fillStyle="#b9d58d"; ctx.fill();
    } else {
      roundedRect(-250,-48,500,96,12,"#2b1b25","#d8d3df",3);
      ctx.fillStyle="#f5ede2"; ctx.fillRect(-238,-38,476,76);
      ctx.fillStyle="#3c2a35"; ctx.fillRect(-238,-38,476,76);
      ctx.fillStyle="#f5ede2";
      for (let i=0;i<42;i++) ctx.fillRect(-230+(i%21)*22,-34+Math.floor(i/21)*42,18,34);
      if (ingredientCount>=1) ctx.fillStyle="#4e6d39",ctx.fillRect(-220,-34,440,18);
      if (ingredientCount>=2) ctx.fillStyle="#8fc4a4",ctx.fillRect(-220,-16,440,14);
      if (ingredientCount>=3) ctx.fillStyle="#ef7d99",ctx.fillRect(-220,-2,440,24);
      if (ingredientCount>=4) ctx.fillStyle="#f0b970",ctx.fillRect(-220,22,440,16);
    }
    ctx.restore();
  }

  function drawBackground(tint="rgba(56,37,54,.35)") {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#4a354f"); g.addColorStop(.6,"#352735"); g.addColorStop(1,"#1a1420");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=tint; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.14;
    ctx.fillStyle="#f2a8bd";
    for(let i=0;i<28;i++) ctx.fillRect((i*173)%W,(i*97)%H,2,2);
    ctx.globalAlpha=1;
  }

  function drawTopProgressHuman() {
    progressBar(790,82,390,"Human","50","#f2a8bd","●");
  }

  // ==================== STATE TRANSITIONS ====================
  function beginGame() {
    resetGame();
    sessionStart=performance.now();
    startShopping();
  }

  function clearStageInputs() {
    keys={}; mouse.down=false; enterPressed=false;
  }

  function startShopping() {
    gameState="shop"; clearStageInputs(); stageStart=performance.now(); transitionUntil=0;
    shop={
      collected:[],
      penaltySeconds:0,
      wrongFlash:0,
      positiveFlash:[],
      cartBump:0,
      complete:false
    };
    initShopItems();
  }

  function startAssembly() {
    gameState="assembly"; clearStageInputs(); stageStart=performance.now(); transitionUntil=0;
    assembly={
      roll:0, step:0, feedback:"", feedbackKind:"", feedbackUntil:0,
      question:null, choices:[], selected:-1, canAnswer:true,
      aiBase:0
    };
    nextAssemblyQuestion();
  }

  function startCutting() {
    gameState="cutting"; clearStageInputs(); stageStart=performance.now(); transitionUntil=0;
    cutting={
      roll:0, knifeY:0, knifePhase:0, feedback:"", feedbackKind:"",
      feedbackUntil:0, activeRoll:null, betweenUntil:0,
      sliceFlash:[]
    };
    spawnCuttingRoll();
  }

  function startServing() {
    gameState="serving"; clearStageInputs(); stageStart=performance.now(); transitionUntil=0;
    serving={
      elapsed:0, served:0,
      player:{x:120,y:610,r:15},
      feedback:"", feedbackUntil:0,
      customers:[
        {x:1020,y:250,r:18,served:false,color:"#f49aaf"},
        {x:725,y:540,r:18,served:false,color:"#d5a1d9"},
        {x:1060,y:645,r:18,served:false,color:"#ffc0cf"}
      ],
      pedestrians:[
        {x:500,y:220,dx:28,range:[410,660]},
        {x:820,y:400,dx:-22,range:[730,1050]},
        {x:470,y:630,dx:24,range:[360,650]}
      ]
    };
  }

  function finishShopping() {
    if (shop.complete) return;
    shop.complete=true;
    stats.shopTime=elapsedSince(stageStart)+shop.penaltySeconds;
    stageCompleteMessage="Shopping Complete!";
    transitionUntil=performance.now()+1300;
  }

  function finishAssembly() {
    stats.assemblyAccuracy=stats.assemblyAttempts?stats.assemblyCorrect/stats.assemblyAttempts*100:0;
    stageCompleteMessage="Assembly Complete!";
    transitionUntil=performance.now()+1300;
  }

  function finishCutting() {
    stats.cuttingAccuracy=stats.cuttingAttempts?stats.cuttingCorrect/stats.cuttingAttempts*100:0;
    stageCompleteMessage="Cutting Complete!";
    transitionUntil=performance.now()+1300;
  }

  function finishServing() {
    if (stats.servingTime!==null) return;
    stats.servingTime=elapsedSince(stageStart);
    stageCompleteMessage="All Orders Served!";
    transitionUntil=performance.now()+1500;
  }

  function toEnding() {
    gameState="ending"; clearStageInputs();
  }

  // ==================== MAIN MENU ====================
  function drawMainMenu(t) {
    drawBackground();

    // restaurant window
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
    ctx.fillStyle="#d7a0bc"; ctx.fillRect(805,0,475,330);
    ctx.fillStyle="#5f4b69"; ctx.fillRect(850,45,390,245);
    ctx.fillStyle="#a5a0bd"; ctx.fillRect(915,75,260,180);
    ctx.fillStyle="#33263a";
    ctx.fillRect(1038,75,8,180); ctx.fillRect(915,158,260,8);
    ctx.restore();

    // cherry branches
    ctx.strokeStyle="#3a2034"; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(-20,280); ctx.bezierCurveTo(100,210,90,80,210,-20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1010,330); ctx.bezierCurveTo(1120,210,1180,180,1300,130); ctx.stroke();
    ctx.fillStyle="#f2a8bd";
    for(let i=0;i<22;i++){
      const x=(i*83)%620-20, y=(i*61)%260;
      ctx.beginPath(); ctx.arc(x,y,7+(i%3)*2,0,Math.PI*2); ctx.fill();
    }

    // lanterns and counter
    ctx.fillStyle="#bf777f";
    roundedRect(40,280,170,420,20,"#2b1d29","#d8d3df",2);
    ctx.fillStyle="#f2a8bd";
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.ellipse(100+i*160,420,56,72,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(255,220,195,.6)";
      ctx.beginPath(); ctx.ellipse(100+i*160,420,34,55,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#f2a8bd";
    }
    roundedRect(0,625,W,95,0,"#4a2f42","#d8d3df",2);

    ctx.save();
    ctx.translate(640,205);
    ctx.rotate(-.02);
    text("Sushi",0,-72,118,"center","middle","#fff","Georgia");
    text("Showdown",0,35,78,"center","middle","#f5dbe6","Georgia");
    ctx.restore();
    ctx.strokeStyle="rgba(216,211,223,.7)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(640,205,370,115,-.08,0,Math.PI*2); ctx.stroke();
    star(1000,95,18,"#fff");

    roundedRect(320,330,640,100,28,"rgba(78,57,76,.78)","rgba(231,181,202,.78)",3);
    text("Beat the AI sushi chef by making your sushi",640,365,28,"center","middle","#fff");
    text("faster and better, or get fired.",640,405,28,"center","middle","#fff");

    const bx=450, by=475, bw=380, bh=90;
    const hover=mouse.x>=bx&&mouse.x<=bx+bw&&mouse.y>=by&&mouse.y<=by+bh;
    ctx.shadowBlur=hover?38:22; ctx.shadowColor="#f2a8bd";
    roundedRect(bx,by,bw,bh,22,hover?"#ffb1c8":"#e58fae","#ffd9e6",3);
    ctx.shadowBlur=0;
    text("▶  BEGIN",bx+bw/2,by+bh/2+3,42,"center","middle","#fff","Georgia");
    text("LMC 2700  •  FINAL PROJECT",640,668,14,"center","middle","#d8d3df");

    drawSushiRoll(205,650,.43,4,false);
    drawSushiRoll(1075,650,.43,4,false);
  }

  // ==================== SHOP ====================
  function initShopItems() {
    const names=[...requiredNames,"Tomato","Cheese","Strawberry","Bread"];
    const positions=[
      [330,210],[510,210],[690,210],[870,210],[1050,210],[330,380],
      [510,380],[690,380],[870,380],[1050,380]
    ];
    shop.items=names.map((name,i)=>({
      name, x:positions[i][0], y:positions[i][1], collected:false,
      required:requiredNames.includes(name), icon:i%10
    }));
  }

  function drawIngredientIcon(item,x,y) {
    ctx.save(); ctx.translate(x,y);
    if(item.name==="Sushi rice"){ctx.fillStyle="#f6eee2";for(let i=0;i<13;i++){ctx.beginPath();ctx.arc((i%5)*9-18,Math.floor(i/5)*9-8,5,0,7);ctx.fill();}}
    else if(item.name==="Nori"){ctx.fillStyle="#263a30";ctx.fillRect(-20,-16,40,32);ctx.fillStyle="#56705e";ctx.fillRect(-15,-11,30,22);}
    else if(item.name==="Salmon"){ctx.fillStyle="#ed7898";ctx.beginPath();ctx.moveTo(-24,-12);ctx.lineTo(22,-16);ctx.lineTo(27,12);ctx.lineTo(-22,16);ctx.closePath();ctx.fill();ctx.strokeStyle="#ffd0d7";ctx.lineWidth=3;for(let i=-12;i<18;i+=9){ctx.beginPath();ctx.moveTo(i,-13);ctx.lineTo(i+8,14);ctx.stroke();}}
    else if(item.name==="Cucumber"){ctx.fillStyle="#78a95b";ctx.beginPath();ctx.ellipse(0,0,22,15,0,0,7);ctx.fill();ctx.fillStyle="#c7dca1";ctx.beginPath();ctx.ellipse(0,0,13,8,0,0,7);ctx.fill();}
    else if(item.name==="Egg"){ctx.fillStyle="#ffe09a";ctx.beginPath();ctx.ellipse(0,0,22,17,0,0,7);ctx.fill();ctx.fillStyle="#f5b94f";ctx.beginPath();ctx.arc(3,0,8,0,7);ctx.fill();}
    else if(item.name==="Avocado"){ctx.fillStyle="#86b95f";ctx.beginPath();ctx.ellipse(0,0,23,15,.2,0,7);ctx.fill();ctx.fillStyle="#b5ce78";ctx.beginPath();ctx.ellipse(0,0,15,9,.2,0,7);ctx.fill();}
    else if(item.name==="Tomato"){ctx.fillStyle="#df6d67";ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.fill();}
    else if(item.name==="Cheese"){ctx.fillStyle="#f1ca67";ctx.beginPath();ctx.moveTo(-22,14);ctx.lineTo(-12,-16);ctx.lineTo(22,10);ctx.closePath();ctx.fill();}
    else if(item.name==="Strawberry"){ctx.fillStyle="#e96d83";ctx.beginPath();ctx.moveTo(0,-18);ctx.bezierCurveTo(24,-12,19,13,0,20);ctx.bezierCurveTo(-19,13,-24,-12,0,-18);ctx.fill();}
    else {ctx.fillStyle="#d8a66b";ctx.fillRect(-22,-15,44,30);ctx.strokeStyle="#a97d4f";ctx.strokeRect(-22,-15,44,30);}
    ctx.restore();
  }

  function drawShopping(t) {
    drawBackground();
    ctx.fillStyle="rgba(27,20,31,.58)"; ctx.fillRect(0,145,W,575);
    text("Stage 1/4",640,35,17,"center","middle","#e7b5ca");
    text("Shop for Ingredients",640,70,43,"center","middle","#fff","Georgia");
    text("Collect the six sushi ingredients before the AI chef!",640,105,20,"center","middle","#d8d3df");

    progressBar(485,135,300,"AI Chef",shopElapsedAI(),"#b9a0d3","◆");
    progressBar(805,135,300,"You",shop.collected.length/requiredNames.length*100,"#f2a8bd","●");

    const seconds=Math.max(0,elapsedSince(stageStart)+shop.penaltySeconds);
    roundedRect(35,28,210,80,18,"rgba(56,37,54,.92)","#f2a8bd",2);
    text("TIME",55,52,14,"left","middle","#d8d3df");
    text(seconds.toFixed(1)+" s",55,88,34,"left","middle","#fff");

    // shelves
    roundedRect(250,175,820,330,20,"rgba(45,31,46,.86)","#b9a0d3",2);
    ctx.fillStyle="rgba(242,168,189,.12)";
    ctx.fillRect(250,250,820,8); ctx.fillRect(250,420,820,8);
    for(const item of shop.items){
      const hover=mouse.x>item.x-48&&mouse.x<item.x+48&&mouse.y>item.y-48&&mouse.y<item.y+48;
      if(!item.collected){
        roundedRect(item.x-48,item.y-48,96,96,12,hover?"rgba(242,168,189,.30)":"rgba(216,211,223,.10)",hover?"#f2a8bd":"rgba(216,211,223,.45)",2);
        drawIngredientIcon(item,item.x,item.y-5);
        text(item.name,item.x,item.y+38,12,"center","middle","#fff");
      }
    }

    // shopping list
    roundedRect(15,175,220,430,18,"rgba(56,37,54,.92)","#d8d3df",2);
    text("SHOPPING LIST",125,205,16,"center","middle","#fff");
    requiredNames.forEach((name,i)=>{
      const y=250+i*52;
      const got=shop.collected.includes(name);
      ctx.beginPath(); ctx.arc(42,y,12,0,7);
      ctx.fillStyle=got?"#f2a8bd":"rgba(216,211,223,.12)";ctx.fill();
      ctx.strokeStyle=got?"#ffdce7":"#d8d3df";ctx.stroke();
      if(got){ctx.beginPath();ctx.moveTo(36,y);ctx.lineTo(41,y+6);ctx.lineTo(50,y-7);ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();}
      text(name,62,y+5,18,"left","middle",got?"#cfc4cf":"#fff");
    });

    // cart
    roundedRect(1080,530,170,155,18,"rgba(56,37,54,.92)","#f2a8bd",2);
    text("CART",1165,555,15,"center","middle","#fff");
    ctx.save(); ctx.translate(1165,622);
    ctx.strokeStyle="#d8d3df"; ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(-55,-35);ctx.lineTo(-40,25);ctx.lineTo(45,25);ctx.stroke();
    ctx.beginPath();ctx.arc(-32,38,8,0,7);ctx.arc(38,38,8,0,7);ctx.fillStyle="#d8d3df";ctx.fill();
    const collected=shop.collected;
    for(let i=0;i<collected.length;i++){
      ctx.fillStyle=shelfColors[i];ctx.beginPath();ctx.arc(-35+(i%3)*24,-20+Math.floor(i/3)*12,9,0,7);ctx.fill();
    }
    ctx.restore();

    if(shop.wrongFlash>0){
      roundedRect(470,535,340,55,18,"rgba(120,40,70,.94)","#ffb0bd",2);
      text("WRONG ITEM!  +2 seconds",-0+640,562,23,"center","middle","#fff");
      shop.wrongFlash--;
    }
    for(let i=shop.positiveFlash.length-1;i>=0;i--){
      const p=shop.positiveFlash[i]; p.life--;
      ctx.save();ctx.globalAlpha=Math.min(1,p.life/25);star(p.x,p.y,25-(p.life*.3),"#fff");ctx.restore();
      if(p.life<=0)shop.positiveFlash.splice(i,1);
    }
    if(stageCompleteMessage&&gameState==="shop"){
      roundedRect(430,300,420,100,24,"rgba(56,37,54,.96)","#f2a8bd",3);
      text(stageCompleteMessage,640,350,34,"center","middle","#fff","Georgia");
    }
  }

  function shopElapsedAI() {
    if(!stageStart) return 0;
    return elapsedSince(stageStart)/CONFIG.aiShopDuration*100;
  }

  function updateShopping(dt) {
    if(shop.complete){
      if(performance.now()>transitionUntil) {
        stageCompleteMessage="";
        startAssembly();
      }
      return;
    }
  }

  function handleShopClick(mx,my) {
    if(!shop.items||shop.complete)return;
    for(const item of shop.items){
      if(item.collected)continue;
      if(mx>item.x-48&&mx<item.x+48&&my>item.y-48&&my<item.y+48){
        if(item.required){
          item.collected=true;
          if(!shop.collected.includes(item.name))shop.collected.push(item.name);
          shop.positiveFlash.push({x:item.x,y:item.y,life:30});
          shop.cartBump=12;
          if(shop.collected.length===requiredNames.length)finishShopping();
        }else{
          shop.penaltySeconds+=CONFIG.wrongItemPenalty;
          shop.wrongFlash=70;
        }
        break;
      }
    }
  }

  // ==================== ASSEMBLY ====================
  function nextAssemblyQuestion() {
    assembly.question=null;
    const ops=["+","-","×"];
    const op=ops[Math.floor(Math.random()*ops.length)];
    let a,b,answer;
    if(op==="+"){a=randomInt(4,29);b=randomInt(3,18);answer=a+b;}
    else if(op==="-"){a=randomInt(12,40);b=randomInt(2,a-1);answer=a-b;}
    else{a=randomInt(2,12);b=randomInt(2,12);answer=a*b;}
    assembly.question=`${a} ${op} ${b} = ?`;
    const set=new Set([answer]);
    while(set.size<4){
      let delta=randomInt(-12,12);
      if(delta===0)delta=2;
      const candidate=answer+delta;
      if(candidate>=0)set.add(candidate);
    }
    assembly.choices=[...set].sort(()=>Math.random()-.5);
    assembly.selected=-1;
    assembly.canAnswer=true;
  }
  function randomInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

  function answerAssembly(choiceIndex) {
    if(!assembly.canAnswer)return;
    assembly.selected=choiceIndex;
    assembly.canAnswer=false;
    const correctChoice=Number(assembly.choices[choiceIndex])===getAssemblyAnswer();
    stats.assemblyAttempts++;
    if(correctChoice){
      stats.assemblyCorrect++;
      assembly.step++;
      assembly.feedback="Correct!";
      assembly.feedbackKind="correct";
      if(assembly.step>=CONFIG.ingredientsPerRoll){
        assembly.roll++;
        assembly.step=0;
        assembly.feedback="Roll Complete!";
        assembly.feedbackKind="correct";

      assembly.feedback="Incorrect!";
      assembly.feedbackKind="incorrect";

  function getAssemblyAnswer(){
    const parts=assembly.question.match(/-?\d+/g).map(Number);
    if(assembly.question.includes("×"))return parts[0]*parts[1];
    if(assembly.question.includes("+"))return parts[0]+parts[1];
    return parts[0]-parts[1];
  }

  function updateCutting(dt) {
    if(cutting.roll>=CONFIG.requiredRolls){
      if(!transitionUntil)finishCutting();
      if(performance.now()>transitionUntil){
        stageCompleteMessage="";
        startServing();
      }
      return;
    }
    if(cutting.knifePhase>0)cutting.knifePhase-=dt*4;
    if(cutting.activeRoll){
      const r=cutting.activeRoll;
      r.x+=CONFIG.conveyorSpeed*dt;
      for(const g of r.guidelines){
        if(!g.resolved&&g.world<640-CONFIG.cuttingTolerance){
          g.resolved=true;
          stats.cuttingAttempts++;
          stats.cuttingResolved++;
          setCutFeedback("Too Late!","miss");
        }
      }
      if(r.x-r.width/2>W+40){
        cutting.roll++;
        if(cutting.roll<CONFIG.requiredRolls)spawnCuttingRoll();
        else cutting.activeRoll=null;
      }
    }
  }

  function setCutFeedback(msg,kind) {
    cutting.feedback=msg;cutting.feedbackKind=kind==="good"?"good":"miss";
    cutting.feedbackUntil=performance.now()+650;
  }

  function handleCutKey() {
    cutting.knifePhase=1;
    if(cutting.activeRoll){
      let nearest=null,nearestDistance=Infinity;
      for(const g of cutting.activeRoll.guidelines){
        if(g.resolved)continue;
        const d=Math.abs(g.world-640);
        if(d<nearestDistance){nearest=g;nearestDistance=d;}
      }
      if(nearest&&nearestDistance<=CONFIG.cuttingTolerance){
        nearest.resolved=true; stats.cuttingAttempts++;stats.cuttingCorrect++;
        stats.cuttingResolved++;
        const quality=nearestDistance<24?"Perfect!":"Good!";
        setCutFeedback(quality,"good");
        cutting.sliceFlash.push({x:nearest.world,y:420,life:30});
      }else{
        stats.cuttingAttempts++;
        setCutFeedback(nearest&&nearest.world<640?"Too Late!":"Too Early!","miss");
      }
    }
  }

  const obstacles=[
    {x:230,y:190,w:220,h:105},
    {x:760,y:200,w:220,h:105},
    {x:430,y:430,w:240,h:90},
    {x:865,y:430,w:165,h:105},
    {x:180,y:470,w:180,h:105}
  ];

  function circleRectCollides(cx,cy,r,rect){
    const nearX=clamp(cx,rect.x,rect.x+rect.w),nearY=clamp(cy,rect.y,rect.y+rect.h);
    return (cx-nearX)**2+(cy-nearY)**2<r*r;
  }

  function moveServing(dt){
    let dx=0,dy=0;
    if(keys.w||keys.arrowup)dy-=1;
    if(keys.s||keys.arrowdown)dy+=1;
    if(keys.a||keys.arrowleft)dx-=1;
    if(keys.d||keys.arrowright)dx+=1;
    if(dx||dy){
      const len=Math.hypot(dx,dy);dx/=len;dy/=len;
      const p=serving.player;
      const nx=clamp(p.x+dx*CONFIG.playerSpeed*dt,p.r, W-p.r);
      const ny=clamp(p.y+dy*CONFIG.playerSpeed*dt,p.r,H-p.r);
      let blocked=false;
      for(const o of obstacles){if(circleRectCollides(nx,p.y,p.r,o)){blocked=true;break;} }
      if(!blocked)p.x=nx;
      blocked=false;
      for(const o of obstacles){if(circleRectCollides(p.x,ny,p.r,o)){blocked=true;break;} }
      if(!blocked)p.y=ny;
    }
  }

  function updateServing(dt) {

  function handleServe() {
    if(serving.served>=CONFIG.requiredCustomers)return;
    const p=serving.player;
    let target=null;
    for(const c of serving.customers){
      if(!c.served&&Math.hypot(p.x-c.x,p.y-c.y)<65){target=c;break;}
    }
    if(target){
      target.served=true;serving.served++;
      serving.feedback="Order Delivered!";
      serving.feedbackUntil=performance.now()+900;
    }else{
      serving.feedback="Too far away!";
      serving.feedbackUntil=performance.now()+900;

  canvas.addEventListener("mousemove",e=>{
    const r=canvas.getBoundingCanvasRect?.()||canvas.getBoundingClientRect();
    mouse.x=(e.clientX-r.left)*W/r.width;
    mouse.y=(e.clientY-r.top)*H/r.height;
  });
  canvas.addEventListener("mousedown",e=>{
    e.preventDefault();
    if(paused)return;
    const r=canvas.getBoundingClientRect();
    mouse.x=(e.clientX-r.left)*W/r.width;
    mouse.y=(e.clientY-r.top)*H/r.height;
    mouse.down=true;
    if(gameState==="menu"){
      if(mouse.x>=450&&mouse.x<=830&&mouse.y>=475&&mouse.y<=565)beginGame();
    }else if(gameState==="shop"){
      handleShopClick(mouse.x,mouse.y);
    }else if(gameState==="assembly"){
      handleAssemblyClick(mouse.x,mouse.y);
    }else if(gameState==="ending"){
      if(mouse.x>=460&&mouse.x<=820&&mouse.y>=625&&mouse.y<=697)resetGame();
    }
  });
  canvas.addEventListener("mouseup",()=>mouse.down=false);
  canvas.addEventListener("touchstart",e=>{
    e.preventDefault();
    if(paused)return;
    const t=e.changedTouches[0],r=canvas.getBoundingClientRect();
    mouse.x=(t.clientX-r.left)*W/r.width;mouse.y=(t.clientY-r.top)*H/r.height;
    if(gameState==="menu"&&mouse.x>=450&&mouse.x<=830&&mouse.y>=475&&mouse.y<=565)beginGame();
    else if(gameState==="shop")handleShopClick(mouse.x,mouse.y);
    else if(gameState==="assembly")handleAssemblyClick(mouse.x,mouse.y);
    else if(gameState==="ending"&&mouse.x>=460&&mouse.x<=820&&mouse.y>=625&&mouse.y<=697)resetGame();
  },{passive:false});

  window.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)||k==="enter")e.preventDefault();
    if(k==="p"&&gameState!=="menu"){togglePause();return;}
    if(paused)return;
    if(gameState==="cutting"&&k===" "&&!keys[" "]){
      handleCutKey();
    }
    if(gameState==="serving"&&k==="enter"&&!enterPressed){
      enterPressed=true;handleServe();
    }
    keys[k]=true;
  });
  window.addEventListener("keyup",e=>{
    const k=e.key.toLowerCase();
    keys[k]=false;
    if(k==="enter")enterPressed=false;
  });
  window.addEventListener("blur",()=>{
    keys={};
    enterPressed=false;
    mouse.down=false;
  });

  // ==================== MAIN LOOP ====================
  function frame(now) {
    const dt=Math.min(.033,(now-lastTime)/1000||0);
    lastTime=now;
    if(!paused){
      if(gameState==="shop")updateShopping(dt);
      else if(gameState==="assembly")updateAssembly(dt);
      else if(gameState==="cutting")updateCutting(dt);
      else if(gameState==="serving")updateServing(dt);
    }

    ctx.clearRect(0,0,W,H);
    if(gameState==="menu")drawMainMenu(now);
    else if(gameState==="shop")drawShopping(now);
    else if(gameState==="assembly")drawAssembly(now);
    else if(gameState==="cutting")drawCutting(now);
    else if(gameState==="serving")drawServing(now);
    else if(gameState==="ending")drawEnding(now);

    if(paused){
      ctx.fillStyle="rgba(20,13,22,.72)";ctx.fillRect(0,0,W,H);
      roundedRect(440,290,400,140,20,"rgba(56,37,54,.96)","#f2a8bd",3);
      text("PAUSED",640,340,42,"center","middle","#fff","Georgia");
      text("Press P to continue",640,390,20,"center","middle","#d8d3df");
    }
    requestAnimationFrame(frame);
  }

  // Initialize
  requestAnimationFrame(frame);
  </script>
</body>
</html>
